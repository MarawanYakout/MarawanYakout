# Put this file in the profile repo at: .github/workflows/profile-cards.yml
# It rebuilds the stats, top languages and contribution graph cards once a day
# and commits them to the repo, so the README never depends on an outside server.

name: Update profile cards

on:
  schedule:
    - cron: "30 2 * * *"   # every day at 02:30 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=MarawanYakout&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=MarawanYakout&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution graph card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: MarawanYakout
          THEME: tokyonight
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-summary-card-output
          git commit -m "Update profile cards" || exit 0
          git push
